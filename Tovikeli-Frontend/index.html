<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b54f0'/%3E%3Cpath d='M7 4.5h18.2c1.9 0 2.9 1.7 1.9 3.2l-1.7 2.6c-.5.8-1.3 1.2-2.2 1.2H5.1c-1.9 0-2.9-1.7-1.9-3.2l1.7-2.6c.5-.8 1.2-1.2 2.1-1.2Z' fill='white'/%3E%3Cpath d='M8.7 11.2c1.5 0 2.8.8 3.6 2l4.2 6.8 4.5-7.3c.8-1.2 2-1.9 3.4-1.9h.8c2.2 0 3.5 2.4 2.3 4.2l-6.7 10.4c-1.9 2.9-6.2 2.9-8.1 0L6.1 15.1c-1.3-1.9.1-3.9 2.6-3.9Z' fill='white'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Tovikeli — 轻社交 · 轻论坛 · 轻社区,连接有趣的人与内容" />
    <!-- 社交分享预览（Open Graph / Twitter Card）。静态站点级，适用所有页面；
         不写死 og:url（让抓取器用实际链接，避免所有分享都指向首页）。
         按页动态 og:image/标题需服务端注入（post-demo）。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tovikeli" />
    <meta property="og:title" content="Tovikeli · 轻社交社区" />
    <meta property="og:description" content="Tovikeli — 轻社交 · 轻论坛 · 轻社区,连接有趣的人与内容" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="HahaSNS · 轻社交社区" />
    <meta name="twitter:description" content="Tovikeli — 轻社交 · 轻论坛 · 轻社区,连接有趣的人与内容" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)" />
    <title>HahaSNS · 轻社交社区</title>
    <!-- 自托管字体：取代 Google Fonts，面向中国大陆免被墙/加速，且与站点同源走长缓存 -->
    <link rel="preload" href="/fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <script>
      // Apply saved theme + skin before first paint to avoid a flash
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          var t = q === 'dark' || q === 'light' ? q : localStorage.getItem('haha_theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (q) localStorage.setItem('haha_theme', t);
          var root = document.documentElement;
          root.dataset.theme = t;
          var SK = ['default', 'violet', 'emerald', 'sunset', 'rose', 'cyan'];
          var skin = localStorage.getItem('haha_skin');
          if (SK.indexOf(skin) < 0) skin = 'default';
          root.dataset.skin = skin;
          root.classList.add(t === 'dark' ? skin + '-dark' : skin);
        } catch (e) {}
      })();
      // App-like: prevent pinch-zoom on mobile (user-scalable=no is ignored on iOS).
      // Double-tap zoom is handled safely via CSS `touch-action: manipulation`.
      (function () {
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('touchmove', function (e) { if (e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
