spring.application.name=ContentPlatformBackend

# ---------------------------------------------------------------------------
# Cloud Run port binding.
# Cloud Run injects the port the container must listen on through the `PORT`
# environment variable. Outside Cloud Run the variable is absent, so the server
# falls back to the traditional 8080. This is the only Cloud Run adaptation and
# it changes no other production/security/session behaviour.
# ---------------------------------------------------------------------------
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Shared configuration (all profiles). No datasource and no credentials live
# here; environment-specific connection settings are provided by the active
# profile (application-dev.properties / application-prod.properties) or by the
# deployer through environment variables.
# ---------------------------------------------------------------------------

# Session persistence (Spring Session JDBC, PostgreSQL) — no Redis.
# The JDBC store is activated by the `spring-boot-session-jdbc` module on the
# classpath (Spring Boot 4 moved session auto-configuration out of
# spring-boot-autoconfigure into dedicated modules). The V9 Flyway migration
# creates the SPRING_SESSION / SPRING_SESSION_ATTRIBUTES tables, so Spring
# Session's own schema initialization is disabled.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m

# Established servlet-session cookie contract.
# HttpOnly   : JavaScript can never read the session id.
# SameSite=Lax: the browser does not attach the cookie to cross-site
#               POST/PATCH/DELETE, which is this project's primary CSRF defence
#               (the API is JSON-only and has no CORS configuration).
# `secure` is left to the active profile: false for local HTTP development,
# true for production HTTPS (see application-prod.properties).
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Error responses must never expose internals (message/stack trace/binding
# details/exception class). The API error contract is status-code only.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Spring Security is on the classpath only for BCryptPasswordEncoder
# (PasswordConfiguration). Its auto-configuration would otherwise create a
# random in-memory user and log a "Using generated security password" banner,
# which is meaningless for this session-cookie application. Excluding that one
# auto-configuration removes the generated user/password entirely; the project's
# own AuthenticationFilter remains the single authentication path.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ---------------------------------------------------------------------------
# External content ingestion (P8-B / P8-D, Mastodon public timeline).
#
# DISABLED BY DEFAULT. Nothing is fetched until the operator explicitly enables
# it through environment variables (e.g. SnapDeploy):
#   CONTENTPLATFORM_INGESTION_ENABLED=true
#   CONTENTPLATFORM_INGESTION_MASTODON_ENABLED=true
#   CONTENTPLATFORM_INGESTION_MASTODON_STARTUP_ENABLED=true
#
# P8-D trigger: ONE bounded public-timeline fetch is attempted shortly after the
# application is ready, once per JVM startup (free-tier auto-sleep friendly).
# There is no repeating scheduler, no pagination loop, no history backfill and
# no authentication token (the Mastodon public timeline is unauthenticated).
# The trigger bean does not exist when any of the three flags is not "true".
# ---------------------------------------------------------------------------
contentplatform.ingestion.enabled=false
contentplatform.ingestion.mastodon.enabled=false
contentplatform.ingestion.mastodon.startup-enabled=false
contentplatform.ingestion.mastodon.instance-id=inst_mastodon_social
contentplatform.ingestion.mastodon.startup-delay-ms=2000
contentplatform.ingestion.mastodon.connect-timeout-ms=5000
contentplatform.ingestion.mastodon.read-timeout-ms=15000

# ---------------------------------------------------------------------------
# External content ingestion (P9-F, multi-platform: Misskey).
#
# DISABLED BY DEFAULT. The Misskey adapter itself is beans-only; nothing is
# fetched until the operator explicitly enables it.
#   CONTENTPLATFORM_INGESTION_ENABLED=true
#   CONTENTPLATFORM_INGESTION_MISSKEY_ENABLED=true
# ---------------------------------------------------------------------------
contentplatform.ingestion.misskey.enabled=false
contentplatform.ingestion.misskey.connect-timeout-ms=5000
contentplatform.ingestion.misskey.read-timeout-ms=15000

# ---------------------------------------------------------------------------
# Generic multi-instance startup trigger (P9-F).
#
# DISABLED BY DEFAULT. Created only when BOTH flags below are "true" and the
# controlled instance-id list is non-empty. Each listed instance is fetched at
# most once per JVM, one bounded page, sequentially, with failures isolated.
#   CONTENTPLATFORM_INGESTION_ENABLED=true
#   CONTENTPLATFORM_INGESTION_STARTUP_ENABLED=true
#   CONTENTPLATFORM_INGESTION_STARTUP_INSTANCE_IDS=inst_misskey_art
# ---------------------------------------------------------------------------
contentplatform.ingestion.startup.enabled=false
contentplatform.ingestion.startup.instance-ids=
contentplatform.ingestion.startup.delay-ms=2000

# ---------------------------------------------------------------------------
# Public Feed background refill (P9-G3).
#
# DISABLED BY DEFAULT. When enabled together with contentplatform.ingestion.enabled
# and a non-empty controlled instance list (startup.instance-ids is reused as the
# shared controlled instance list), a Feed request that reaches the tail of the
# public content pool requests ONE non-blocking background refill through the
# existing ingestion pipeline. Single-flight per JVM; failures are isolated and
# never affect the Feed response.
#   CONTENTPLATFORM_INGESTION_ENABLED=true
#   CONTENTPLATFORM_INGESTION_FEED_REFILL_ENABLED=true
#   CONTENTPLATFORM_INGESTION_STARTUP_INSTANCE_IDS=inst_misskey_art
# ---------------------------------------------------------------------------
contentplatform.ingestion.feed-refill.enabled=false

# Local Tovikeli media upload limits.
spring.servlet.multipart.max-file-size=${TOVIKELI_MEDIA_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${TOVIKELI_MEDIA_MAX_REQUEST_SIZE:100MB}
tovikeli.media.max-file-size-bytes=${TOVIKELI_MEDIA_MAX_FILE_SIZE_BYTES:104857600}
tovikeli.media.storage-dir=${TOVIKELI_MEDIA_STORAGE_DIR:./data/media}
