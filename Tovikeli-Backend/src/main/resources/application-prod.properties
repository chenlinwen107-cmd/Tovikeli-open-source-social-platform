# ---------------------------------------------------------------------------
# Production profile.
#
# Activate with:  --spring.profiles.active=prod
#
# ALL connection settings MUST come from the environment. There are no defaults
# and no credentials are stored in this file. Startup fails fast if a required
# variable is missing, so a misconfigured deploy cannot silently fall back to a
# development database.
#
#   DB_URL        e.g. jdbc:postgresql://db.internal:5432/contentplatform
#   DB_USERNAME   dedicated least-privilege database role
#   DB_PASSWORD   provided by the runtime secret store
# ---------------------------------------------------------------------------

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production runs behind HTTPS, so the session cookie is Secure.
# HttpOnly + SameSite=Lax are inherited from application.properties and repeated
# here to make the production cookie contract explicit.
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

# Logging: quiet framework internals so ordinary logs stay meaningful and never
# carry credentials. Flyway logs the database URL (host/database), never the
# password. Request/response bodies are not logged by the application.
logging.level.root=INFO
logging.level.com.contentplatform=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.jdbc=WARN
logging.level.org.flywaydb=INFO
