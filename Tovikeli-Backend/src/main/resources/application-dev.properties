# ---------------------------------------------------------------------------
# Development profile — local PostgreSQL over plain HTTP.
#
# Activate with:  --spring.profiles.active=dev
# Connection settings may be supplied through the environment:
#   DB_URL       (default: jdbc:postgresql://127.0.0.1:5432/contentplatform_dev)
#   DB_USERNAME  (default: the local OS user name)
#   DB_PASSWORD  (default: empty)
#
# This profile is for local development only. It deliberately does NOT use the
# production database and does NOT enable the Secure cookie flag, so the session
# works over http://localhost.
# ---------------------------------------------------------------------------

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/contentplatform_dev}
spring.datasource.username=${DB_USERNAME:${USER:}}
spring.datasource.password=${DB_PASSWORD:}

# Local HTTP: a Secure cookie would never be sent, so keep it off in development.
server.servlet.session.cookie.secure=false
