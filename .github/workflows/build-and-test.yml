name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tovikeli-Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Tovikeli-Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies (advisory)
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'for (const f of ["npm-audit.json","npm-audit-production.json"]) { const a=require("./"+f); const v=a.vulnerabilities||{}; console.log(f, JSON.stringify({counts:a.metadata?.vulnerabilities, packages:Object.entries(v).map(([name,x])=>({name,severity:x.severity,direct:x.isDirect,range:x.range,fixAvailable:x.fixAvailable}))},null,2)); }'

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit
          path: |
            Tovikeli-Frontend/npm-audit.json
            Tovikeli-Frontend/npm-audit-production.json
          if-no-files-found: ignore
          retention-days: 7

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  backend:
    name: Backend - Gradle tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tovikeli-Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            Tovikeli-Backend/**/*.gradle*
            Tovikeli-Backend/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            Tovikeli-Backend/build/test-results/test/
            Tovikeli-Backend/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 3

  backend-postgres-smoke:
    name: Backend - PostgreSQL startup and migration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tovikeli_ci
          POSTGRES_USER: tovikeli_ci
          POSTGRES_PASSWORD: tovikeli_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tovikeli_ci -d tovikeli_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://127.0.0.1:5432/tovikeli_ci
      DB_USERNAME: tovikeli_ci
      DB_PASSWORD: tovikeli_ci_password
    defaults:
      run:
        working-directory: Tovikeli-Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            Tovikeli-Backend/**/*.gradle*
            Tovikeli-Backend/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Start backend against PostgreSQL
        run: |
          chmod +x ./gradlew
          ./gradlew bootRun --no-daemon --console=plain > /tmp/tovikeli-backend.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; wait "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 90); do
            STATUS=$(curl --silent --output /tmp/tovikeli-response.json --write-out '%{http_code}' \
              'http://127.0.0.1:8080/api/v1/search?q=ci-smoke' || true)
            if [ "$STATUS" = "200" ]; then
              echo "Backend started, Flyway migrations completed, and database-backed search endpoint returned HTTP 200."
              cat /tmp/tovikeli-response.json
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/tovikeli-backend.log
              exit 1
            fi
            sleep 2
          done

          cat /tmp/tovikeli-backend.log
          echo "Backend did not become ready within 180 seconds."
          exit 1
