name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tovikeli-Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Tovikeli-Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  backend:
    name: Backend - Gradle tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tovikeli-Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            Tovikeli-Backend/**/*.gradle*
            Tovikeli-Backend/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            Tovikeli-Backend/build/test-results/test/
            Tovikeli-Backend/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 3
